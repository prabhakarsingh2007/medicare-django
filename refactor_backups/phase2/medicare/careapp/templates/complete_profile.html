{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#f8fafc] py-12 px-4 relative overflow-hidden">
    
    <div class="absolute top-0 -left-4 w-72 h-72 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
    <div class="absolute bottom-0 -right-4 w-72 h-72 bg-cyan-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>

    <div class="max-w-md w-full z-10">
        <div class="bg-white/90 backdrop-blur-xl shadow-[0_20px_50px_rgba(8,_112,_184,_0.1)] rounded-3xl p-8 border border-white">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold pb-2 leading-tight bg-gradient-to-r from-blue-700 to-cyan-500 bg-clip-text text-transparent inline-block">
                    Complete Your Profile
                </h1>
                <p class="text-gray-500 text-sm mt-2">To access your dashboard, please complete your profile details.</p>
            </div>

            <form method="POST" action="{% url 'complete_profile' %}" class="space-y-5">
                {% csrf_token %}
                
                <div class="group">
                    <label class="block mb-1.5 ml-1 text-sm font-semibold text-gray-700 transition-colors group-focus-within:text-blue-600">
                        Phone Number
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        </span>
                        <input type="text" name="phone" placeholder="9876543210" value="{{ patient.phone|default_if_none:'' }}" required
                               class="w-full pl-11 pr-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-5">
                    <div class="group">
                        <label class="block mb-1.5 ml-1 text-sm font-semibold text-gray-700 transition-colors group-focus-within:text-blue-600">
                            Age
                        </label>
                        <input type="number" name="age" placeholder="25" min="1" max="130" value="{{ patient.age|default_if_none:'' }}" required
                               class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
                    </div>
                    
                    <div class="group">
                        <label class="block mb-1.5 ml-1 text-sm font-semibold text-gray-700 transition-colors group-focus-within:text-blue-600">
                            Gender
                        </label>
                        <select name="gender" required
                                class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
                            <option value="">Select Gender</option>
                            <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                </div>

                <div class="group">
                    <label class="block mb-1.5 ml-1 text-sm font-semibold text-gray-700 transition-colors group-focus-within:text-blue-600">
                        Address
                    </label>
                    <div class="relative">
                        <textarea name="address" placeholder="Complete Address" rows="3" required
                                  class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">{{ patient.address|default_if_none:'' }}</textarea>
                    </div>
                </div>

                <button type="submit"
                        class="w-full mt-4 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold py-3.5 rounded-2xl
                               shadow-lg shadow-blue-200 hover:shadow-blue-300 hover:-translate-y-0.5 active:scale-95
                               transition duration-300 flex items-center justify-center gap-2">
                    Save and Continue
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </button>
            </form>

        </div>
    </div>
</div>

<style>
/* Subtle floating animation for background blobs */
@keyframes blob {
    0% { transform: translate(0px, 0px) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
    100% { transform: translate(0px, 0px) scale(1); }
}
.animate-blob {
    animation: blob 7s infinite;
}
.animation-delay-2000 {
    animation-delay: 2s;
}
</style>
{% endblock %}
