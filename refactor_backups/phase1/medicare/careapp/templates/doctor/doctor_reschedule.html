{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
        <h2 class="text-2xl font-bold mb-6 text-blue-700">Reschedule Appointment</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">New Date</label>
                <input type="date" name="date" required value="{{ appointment.date }}"
                    min="{{ today|default:appointment.date }}"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">New Time</label>
                <input type="time" name="time" required value="{{ appointment.time|time:'H:i' }}"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-blue-700 transition">Reschedule</button>
        </form>
        <a href="{% url 'doctor_dashboard' %}" class="block text-center mt-6 text-blue-500 hover:underline">Back to Dashboard</a>
    </div>
</div>
{% endblock %}
