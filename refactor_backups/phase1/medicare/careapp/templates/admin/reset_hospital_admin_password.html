{% extends "admin/adminbase.html" %}

{% block admin_content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h1 class="text-2xl font-black text-slate-800">Reset Hospital Admin Password</h1>
        <p class="text-sm text-slate-500">User: {{ profile.user.username }} | Hospital: {{ profile.hospital.name }}</p>
    </div>

    <form method="POST" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 md:p-8 space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">New Password</label>
            <input type="password" name="new_password" required minlength="6" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Confirm Password</label>
            <input type="password" name="confirm_password" required minlength="6" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50">
        </div>

        <div class="pt-2 flex gap-3">
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 transition">Update Password</button>
            <a href="{% url 'view_hospital_admins' %}" class="px-6 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold hover:bg-slate-50 transition">Back</a>
        </div>
    </form>
</div>
{% endblock %}
