{% extends "dashboard/adminbase.html" %}

{% block admin_content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8">
        <h1 class="text-2xl font-black text-slate-800">Create Hospital Admin</h1>
        <p class="text-sm text-slate-500">Each hospital can have its own login account.</p>
    </div>

    <form method="POST" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 md:p-8 space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Hospital</label>
            <select name="hospital" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50">
                <option value="" disabled selected>Select hospital</option>
                {% for h in hospitals %}
                <option value="{{ h.id }}">{{ h.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Full Name</label>
                <input type="text" name="full_name" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email (optional)</label>
                <input type="email" name="email" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50">
            </div>
        </div>

        <div class="pt-2 flex gap-3">
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 transition">Create Admin</button>
            <a href="{% url 'admin-dashboard' %}" class="px-6 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold hover:bg-slate-50 transition">Back</a>
        </div>
    </form>
</div>
{% endblock %}
