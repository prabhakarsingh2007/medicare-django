{% extends "core/base.html" %}

{% block content %}


<div class="min-h-screen bg-gray-50 py-10 px-4">
    <div class="max-w-4xl mx-auto">
        
        <div class="mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-800">Edit Appointment</h1>
            <p class="text-gray-500 mt-1">Modify your scheduled visit details.</p>
        </div>

        <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden p-6">
            <!-- Form for editing appointment details -->
            <form method="POST" action="{% url 'edit_appointment' id=appointment.id %}" class="space-y-6" id="editAppointmentForm">
                {% csrf_token %}
                
                <!-- Date and Time -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Date</label>
                        <input type="date" id="appointmentDate" name="date" value="{{ appointment.date|date:'Y-m-d' }}" required
                            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Choose Time Slot (30 Min)</label>
                    <input type="hidden" name="time" id="selectedTimeValue" value="{{ appointment.time|time:'H:i' }}" required>
                    <div id="slotGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <p class="col-span-full text-gray-400 text-sm italic">Loading slots...</p>
                    </div>
                </div>

                <!-- Message to Doctor -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Message to Doctor (Optional)</label>
                    <textarea name="message" rows="4" placeholder="Enter any specific concerns or instructions for the doctor..."
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition resize-none">{{ appointment.message }}</textarea>
                </div>

                <!-- Submit Button -->
                <div>
                    <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg text-sm font-bold hover:bg-blue-700 transition">
                        Update Appointment
                    </button>
                </div>
            </form>
        </div>  
    </div>
</div>

<script>
const dateInput = document.getElementById('appointmentDate');
const slotGrid = document.getElementById('slotGrid');
const hiddenTimeInput = document.getElementById('selectedTimeValue');
const initialTime = "{{ appointment.time|time:'H:i' }}";

const todayStr = new Date().toISOString().split('T')[0];
dateInput.setAttribute('min', todayStr);

if (dateInput.value < todayStr) {
    dateInput.value = todayStr;
}

function generateSlots() {
    const selectedDate = dateInput.value;
    if (!selectedDate) {
        slotGrid.innerHTML = '<p class="col-span-full text-gray-400 text-sm italic">Please select date first.</p>';
        return;
    }

    slotGrid.innerHTML = '<p class="col-span-full text-gray-400 text-sm italic">Loading slots...</p>';

    const query = new URLSearchParams({
        doctor_id: '{{ appointment.doctor.id }}',
        appointment_id: '{{ appointment.id }}',
        date: selectedDate
    });

    fetch(`{% url 'booked_slots' %}?${query.toString()}`)
        .then(response => response.json())
        .then(data => {
            const bookedSlots = data.success ? data.booked_slots : [];
            const now = new Date();
            const isToday = selectedDate === todayStr;
            slotGrid.innerHTML = '';

            for (let hour = 9; hour < 17; hour++) {
                [0, 30].forEach(min => {
                    const slotTime = new Date();
                    slotTime.setHours(hour, min, 0, 0);

                    const timeVal = `${String(hour).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
                    const ampm = hour >= 12 ? 'PM' : 'AM';
                    const displayHour = hour % 12 || 12;
                    const timeDisplay = `${displayHour}:${String(min).padStart(2, '0')} ${ampm}`;
                    const isPast = isToday && (slotTime <= now);
                    const isBooked = bookedSlots.includes(timeVal);

                    const btn = document.createElement('div');
                    btn.innerText = timeDisplay;

                    if (isPast || isBooked) {
                        btn.className = 'p-3 text-center text-xs bg-gray-100 text-gray-400 rounded-lg border border-gray-200 cursor-not-allowed';
                    } else {
                        btn.className = 'p-3 text-center text-xs bg-white border border-blue-200 text-blue-700 rounded-lg cursor-pointer hover:bg-blue-50 transition-all slot-item';

                        if (hiddenTimeInput.value === timeVal) {
                            btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                        }

                        btn.onclick = function() {
                            document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('bg-blue-600', 'text-white', 'border-blue-600'));
                            btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                            hiddenTimeInput.value = timeVal;
                        };
                    }

                    slotGrid.appendChild(btn);
                });
            }

            const selectedSlotExists = [...document.querySelectorAll('.slot-item')].some(el => {
                return el.classList.contains('bg-blue-600');
            });

            if (!selectedSlotExists) {
                hiddenTimeInput.value = '';
            }
        })
        .catch(() => {
            slotGrid.innerHTML = '<p class="col-span-full text-red-500 text-sm italic">Could not load slots. Try changing date.</p>';
            hiddenTimeInput.value = '';
        });
}

dateInput.addEventListener('change', function() {
    hiddenTimeInput.value = '';
    generateSlots();
});

generateSlots();

document.getElementById('editAppointmentForm').addEventListener('submit', function(e) {
    if (!hiddenTimeInput.value) {
        e.preventDefault();
        alert('Please select a valid time slot.');
    }
});
</script>


{% endblock  %}
