{% extends "core/base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#f8fafc] py-12 px-4 relative overflow-hidden">
    
    <div class="absolute top-0 -left-4 w-72 h-72 bg-indigo-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
    <div class="absolute bottom-0 -right-4 w-72 h-72 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>

    <div class="max-w-md w-full z-10">
        <div class="bg-white/90 backdrop-blur-xl shadow-[0_20px_50px_rgba(8,_112,_184,_0.1)] rounded-3xl p-8 border border-white">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold pb-2 leading-tight bg-gradient-to-r from-blue-700 to-indigo-500 bg-clip-text text-transparent inline-block">
                    Verify Login OTP
                </h1>
                <p class="text-gray-500 text-sm mt-2">Enter the 6-digit OTP sent to your Email<br/><strong class="text-blue-600">{{ email }}</strong></p>
            </div>

            <form method="POST" action="{% url 'verify_otp' %}" class="space-y-5">
                {% csrf_token %}
                
                <div class="group">
                    <label class="block mb-1.5 ml-1 text-sm font-semibold text-gray-700 transition-colors group-focus-within:text-blue-600 text-center">
                        6-Digit OTP Code
                    </label>
                    <div class="relative">
                        <input type="text" name="otp" placeholder="••••••" required pattern="\d{6}" maxlength="6"
                               class="w-full px-4 py-4 text-center text-2xl tracking-[0.5em] font-bold bg-gray-50/50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:border-transparent outline-none transition-all">
                    </div>
                </div>

                <button type="submit"
                        class="w-full mt-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 rounded-2xl
                               shadow-lg shadow-blue-200 hover:shadow-blue-300 hover:-translate-y-0.5 active:scale-95
                               transition duration-300 flex items-center justify-center gap-2">
                    Verify OTP
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-gray-500 text-sm">
                    Didn't receive code? 
                    <a href="{% url 'register' %}" class="text-blue-600 font-bold hover:text-blue-700 transition-colors">
                        Change Email / Resend
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<style>
@keyframes blob {
    0% { transform: translate(0px, 0px) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
    100% { transform: translate(0px, 0px) scale(1); }
}
.animate-blob {
    animation: blob 7s infinite;
}
.animation-delay-2000 {
    animation-delay: 2s;
}
</style>
{% endblock %}
