{% extends "core/base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-14">
  <h2 class="text-4xl md:text-5xl font-extrabold text-center mb-12 py-2 leading-relaxed bg-gradient-to-r from-blue-600 to-cyan-500 bg-clip-text text-transparent">
    Book Appointment
  </h2>

  <div class="bg-white rounded-3xl shadow-xl p-6 md:p-10 border border-gray-100">
    <div class="flex flex-col sm:flex-row items-center gap-6 mb-10 pb-8 border-b border-gray-50">
      {% if doctor.image %}
        <div class="overflow-hidden rounded-2xl w-28 h-28 shadow-md">
          <img src="{{ doctor.image.url }}" class="w-full h-full object-cover" alt="{{ doctor.name }}">
        </div>
      {% endif %}
      <div class="text-center sm:text-left">
        <h3 class="text-2xl font-bold text-gray-900">{{ doctor.name }}</h3>
        <p class="text-blue-600 font-medium text-sm">9:00 AM - 5:00 PM (Available Slots)</p>
        <p class="text-gray-500 text-sm font-bold">Fee: ₹{{ doctor.fees|default:"500" }}</p>
      </div>
    </div>

    <form id="appointmentForm" method="post" action="{% url 'book_appointment' doctor.slug %}">
      {% csrf_token %}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-gray-700">Full Name</label>
          <input type="text" name="name" value="{{ patient.name|default:user.get_full_name|default:user.username }}" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-gray-700">Email Address</label>
          <input type="email" name="email" value="{{ patient.email|default:user.email }}" required maxlength="254" placeholder="name@example.com" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-gray-700">Phone Number</label>
          <input type="tel" name="phone" value="{{ patient.phone|default:'' }}" required minlength="10" maxlength="10" pattern="[0-9]{10}" inputmode="numeric" placeholder="10-digit number" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-gray-700">Select Date</label>
          <input type="date" id="appointmentDate" name="date" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="col-span-1 md:col-span-2 space-y-3 mt-4">
          <label class="text-sm font-semibold text-gray-700">Chose a Time Slot (30 Min Each)</label>
          <input type="hidden" name="time" id="selectedTimeValue" required>
          <div id="slotGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <p class="col-span-full text-gray-400 text-sm italic">Pehle date select karein...</p>
          </div>
        </div>
        <div class="col-span-1 md:col-span-2 space-y-3 mt-4">
          <label class="text-sm font-semibold text-gray-700">Payment Method</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <label class="flex items-center gap-3 p-4 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-100 transition duration-200">
              <input type="radio" name="payment_method" value="online" checked class="w-5 h-5 text-blue-600 focus:ring-blue-500">
              <div>
                <p class="font-bold text-gray-800 text-sm">Online Payment</p>
                <p class="text-xs text-gray-500">Pay securely via Razorpay</p>
              </div>
            </label>
            <label class="flex items-center gap-3 p-4 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-100 transition duration-200">
              <input type="radio" name="payment_method" value="offline" class="w-5 h-5 text-blue-600 focus:ring-blue-500">
              <div>
                <p class="font-bold text-gray-800 text-sm">Pay at Clinic</p>
                <p class="text-xs text-gray-500">Book directly, pay offline</p>
              </div>
            </label>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition duration-300">
        Proceed to Payment
      </button>
    </form>
  </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
// --- 1. SLOT GENERATION LOGIC ---
const dateInput = document.getElementById('appointmentDate');
const slotGrid = document.getElementById('slotGrid');
const hiddenTimeInput = document.getElementById('selectedTimeValue');

const todayStr = new Date().toISOString().split('T')[0];
dateInput.setAttribute('min', todayStr);

function generateSlots() {
    const selectedDate = dateInput.value;
    if (!selectedDate) return;

    slotGrid.innerHTML = '<p class="col-span-full text-blue-600 text-sm italic">Loading slots...</p>';

    fetch(`/booked_slots/?doctor_id={{ doctor.id }}&date=${selectedDate}`)
    .then(response => response.json())
    .then(data => {
        const bookedSlots = data.booked_slots || [];
        slotGrid.innerHTML = '';
        const now = new Date();
        const isToday = (selectedDate === todayStr);

        for (let hour = 9; hour < 17; hour++) {
            [0, 30].forEach(min => {
                const slotTime = new Date();
                slotTime.setHours(hour, min, 0, 0);
                const timeVal = `${String(hour).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
                const ampm = hour >= 12 ? 'PM' : 'AM';
                const displayHour = hour % 12 || 12;
                const timeDisplay = `${displayHour}:${String(min).padStart(2, '0')} ${ampm}`;
                const isPast = isToday && (slotTime <= now);
                const isBooked = bookedSlots.includes(timeVal);
                
                const btn = document.createElement('div');
                btn.innerText = timeDisplay;
                
                if (isPast) {
                    btn.className = "p-3 text-center text-xs bg-gray-100 text-gray-400 rounded-lg border border-gray-200 cursor-not-allowed";
                } else if (isBooked) {
                    btn.className = "p-3 text-center text-xs bg-rose-50 text-rose-400 rounded-lg border border-rose-100 cursor-not-allowed line-through";
                    btn.title = "This slot is already booked";
                } else {
                    btn.className = "p-3 text-center text-xs bg-white border border-blue-200 text-blue-700 rounded-lg cursor-pointer hover:bg-blue-50 transition-all slot-item";
                    btn.onclick = function() {
                        document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('bg-blue-600', 'text-white', 'border-blue-600'));
                        btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                        hiddenTimeInput.value = timeVal;
                    };
                }
                slotGrid.appendChild(btn);
            });
        }
    })
    .catch(err => {
        console.error("Error loading booked slots:", err);
        slotGrid.innerHTML = '<p class="col-span-full text-red-500 text-sm">Failed to load slots. Please reload.</p>';
    });
}
dateInput.addEventListener('change', generateSlots);

// --- 2. PAYMENT & SUBMIT LOGIC ---
const submitBtn = document.getElementById("submitBtn");
document.querySelectorAll('input[name="payment_method"]').forEach(radio => {
    radio.addEventListener('change', function() {
        if (this.value === 'offline') {
            submitBtn.innerHTML = "Book Appointment";
        } else {
            submitBtn.innerHTML = "Proceed to Payment";
        }
    });
});

document.getElementById("appointmentForm").addEventListener("submit", function(e) {
    e.preventDefault(); // JSON screen par aane se rokne ke liye ye zaroori hai

    if (!hiddenTimeInput.value) {
        alert("Please select a time slot!");
        return;
    }

    const form = this;
    const paymentMethod = form.querySelector('input[name="payment_method"]:checked').value;
    submitBtn.disabled = true;
    if (paymentMethod === 'offline') {
        submitBtn.innerHTML = "Booking Appointment...";
    } else {
        submitBtn.innerHTML = "Processing Payment...";
    }

    // Backend se Redirect URL mangwana
    fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { "X-CSRFToken": "{{ csrf_token }}" }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            if (!data.pay_required && data.message) {
                alert(data.message);
            }
            window.location.href = data.redirect_url || "{% url 'my_appointments' %}";
        } else {
            alert("Error: " + data.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = paymentMethod === 'offline' ? "Book Appointment" : "Proceed to Payment";
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert("Server error. Please try again.");
        submitBtn.disabled = false;
        submitBtn.innerHTML = paymentMethod === 'offline' ? "Book Appointment" : "Proceed to Payment";
    });
});
</script>
{% endblock %}
