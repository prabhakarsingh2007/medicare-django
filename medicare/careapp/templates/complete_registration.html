{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#f8fafc] py-12 px-4 relative overflow-hidden">
    
    <div class="absolute top-0 -left-4 w-72 h-72 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
    <div class="absolute bottom-0 -right-4 w-72 h-72 bg-cyan-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>

    <div class="max-w-md w-full z-10">
        <div class="bg-white/90 backdrop-blur-xl shadow-[0_20px_50px_rgba(8,_112,_184,_0.1)] rounded-3xl p-8 border border-white">
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center bg-emerald-100 text-emerald-600 rounded-full px-4 py-1 text-xs font-bold mb-4">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Email Verified
                </div>
                <h1 class="text-3xl font-extrabold pb-2 leading-tight bg-gradient-to-r from-blue-700 to-cyan-500 bg-clip-text text-transparent inline-block">
                    Complete Details
                </h1>
                <p class="text-gray-500 text-sm mt-1">Set up your account for <strong class="text-blue-600">{{ email }}</strong></p>
            </div>

            <form method="POST" action="{% url 'complete_registration' %}" class="space-y-4">
                {% csrf_token %}
                
                <p class="text-[11px] font-semibold text-slate-500 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-center">
                    Password rule: min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special character.
                </p>
                
                <div class="group">
                    <label class="block mb-1 ml-1 text-sm font-semibold text-gray-700">Full Name</label>
                    <input type="text" name="full_name" required
                           class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="group">
                    <label class="block mb-1 ml-1 text-sm font-semibold text-gray-700">Username</label>
                    <input type="text" name="username" required
                           class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="group relative">
                    <label class="block mb-1 ml-1 text-sm font-semibold text-gray-700">Password</label>
                    <div class="relative">
                        <input id="password1" type="password" name="password1" required
                            minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
                            class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none pr-10">
                        <button type="button" onclick="togglePassword('password1', this)" class="absolute right-3 inset-y-0 text-gray-400 hover:text-blue-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="group relative">
                    <label class="block mb-1 ml-1 text-sm font-semibold text-gray-700">Confirm Password</label>
                    <div class="relative">
                        <input id="password2" type="password" name="password2" required
                            class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none pr-10">
                        <button type="button" onclick="togglePassword('password2', this)" class="absolute right-3 inset-y-0 text-gray-400 hover:text-blue-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                </div>

                <button type="submit"
                        class="w-full mt-4 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold py-3.5 rounded-2xl
                               shadow-lg hover:-translate-y-0.5 transition duration-300">
                    Create Account
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function togglePassword(id, btn) {
    const field = document.getElementById(id);
    const type = field.getAttribute('type') === 'password' ? 'text' : 'password';
    field.setAttribute('type', type);
    if(type === 'text') {
        btn.classList.add('text-blue-600');
    } else {
        btn.classList.remove('text-blue-600');
    }
}
</script>

<style>
@keyframes blob {
    0% { transform: translate(0px, 0px) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
    100% { transform: translate(0px, 0px) scale(1); }
}
.animate-blob {
    animation: blob 7s infinite;
}
.animation-delay-2000 {
    animation-delay: 2s;
}
</style>
{% endblock %}
