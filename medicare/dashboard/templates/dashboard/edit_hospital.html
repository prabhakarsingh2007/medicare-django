{% extends "dashboard/adminbase.html" %}

{% block admin_content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8 flex items-center justify-between gap-3">
        <div>
            <h1 class="text-2xl font-black text-slate-800">Edit Hospital</h1>
            <p class="text-slate-500 text-sm">Update details for <span class="font-bold text-blue-600">{{ hospital.name }}</span></p>
        </div>
        <a href="{% url 'view_hospital' %}" class="px-4 py-2 border border-slate-200 rounded-xl bg-white text-slate-700 font-semibold hover:bg-slate-50 transition">← Back</a>
    </div>

    <form method="POST" class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 md:p-8 space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Hospital Name</label>
            <input type="text" name="name" value="{{ form.name.value|default:'' }}" required
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
            <input type="email" name="email" value="{{ form.email.value|default:'' }}"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Phone</label>
            <input type="text" name="phone" value="{{ form.phone.value|default:'' }}"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Address</label>
            <textarea name="address" rows="4"
                      class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">{{ form.address.value|default:'' }}</textarea>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="px-8 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 transition">
                Save Changes
            </button>
            <a href="{% url 'view_hospital' %}" class="px-8 py-3 rounded-xl border border-slate-300 text-slate-700 font-bold hover:bg-slate-50 transition">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
