{% extends "dashboard/adminbase.html" %}

{% block admin_content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8 flex items-center justify-between gap-3">
        <div>
            <h1 class="text-2xl font-black text-slate-800">Add Hospital</h1>
            <p class="text-slate-500 text-sm">Create hospital branch for multi-hospital setup.</p>
        </div>
        <a href="{% url 'view_hospital' %}" class="px-4 py-2 border border-slate-200 rounded-xl bg-white text-slate-700 font-semibold hover:bg-slate-50 transition">View Hospitals</a>
    </div>

    <form method="POST" class="bg-white border border-slate-200 rounded-3xl shadow-sm p-6 md:p-8 space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Hospital Name</label>
            <input type="text" name="name" value="{{ form.name.value|default:'' }}" required class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Email</label>
            <input type="email" name="email" value="{{ form.email.value|default:'' }}" class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Phone</label>
            <input type="text" name="phone" value="{{ form.phone.value|default:'' }}" class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Address</label>
            <textarea name="address" rows="4" class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">{{ form.address.value|default:'' }}</textarea>
        </div>

        <div class="pt-2">
            <button type="submit" class="px-8 py-3.5 rounded-2xl bg-blue-600 text-white font-bold hover:bg-blue-700 hover:shadow-lg hover:shadow-blue-200 hover:-translate-y-0.5 transition-all duration-300">Save Hospital</button>
        </div>
    </form>
</div>
{% endblock %}
