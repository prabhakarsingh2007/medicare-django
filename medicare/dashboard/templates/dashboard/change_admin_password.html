{% extends "dashboard/adminbase.html" %}

{% block admin_content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h1 class="text-2xl font-black text-slate-800">Change My Password</h1>
        <p class="text-sm text-slate-500">Secure your admin account regularly.</p>
    </div>

    <form method="POST" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 md:p-8 space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Current Password</label>
            <input type="password" name="current_password" required class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">New Password</label>
            <input type="password" name="new_password" required minlength="6" class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Confirm New Password</label>
            <input type="password" name="confirm_password" required minlength="6" class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
        </div>

        <div class="pt-2 flex gap-3">
            <button type="submit" class="px-6 py-3 rounded-2xl bg-blue-600 text-white font-bold hover:bg-blue-700 hover:shadow-lg hover:shadow-blue-200 hover:-translate-y-0.5 transition-all duration-300">Change Password</button>
            <a href="{% url 'admin-dashboard' %}" class="px-6 py-3 rounded-2xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50 hover:text-slate-800 transition duration-350">Back</a>
        </div>
    </form>
</div>
{% endblock %}
