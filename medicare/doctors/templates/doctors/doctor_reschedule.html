{% extends "core/base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#f8fafc] py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl shadow-blue-100/30 p-8 border border-slate-100">
        <h2 class="text-2xl font-black mb-6 text-slate-800 tracking-tight text-center">Reschedule Appointment</h2>
        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">New Date</label>
                <input type="date" name="date" required value="{{ appointment.date }}"
                    min="{{ today|default:appointment.date }}"
                    class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">New Time</label>
                <input type="time" name="time" required value="{{ appointment.time|time:'H:i' }}"
                    class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
            </div>
            <button type="submit" class="w-full mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-200 hover:shadow-blue-300 hover:-translate-y-0.5 active:scale-95 transition duration-300">Reschedule</button>
        </form>
        <a href="{% url 'doctor_dashboard' %}" class="block text-center mt-6 text-sm font-bold text-slate-500 hover:text-blue-600 transition">Back to Dashboard</a>
    </div>
</div>
{% endblock %}
